name: Deploy to veranda.my

on:
  push:
    branches: ["main"]

concurrency:
  group: deploy-veranda-my
  cancel-in-progress: true

jobs:
  # ── ГЕЙТ: без зелёных тестов деплой не стартует ──────────────────────────
  # Раньше main уезжал на прод сразу после пуша, а единственной проверкой был
  # `php -l` трёх файлов уже ПОСЛЕ раскатки — то есть поломку ловили на живом
  # сайте. Теперь job `deploy` объявлен через `needs: test`: упал тест или
  # синтаксис — rsync не выполняется вовсе и прод остаётся на прошлой версии.
  test:
    name: Тесты (обязательный гейт)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, xml, curl, tokenizer, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Cache composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-php82-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php82-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: PHP syntax check
        run: |
          set -euo pipefail
          find . \
            -path ./vendor -prune -o \
            -path ./node_modules -prune -o \
            -path ./wa_listener/node_modules -prune -o \
            -name '*.php' -print0 \
          | xargs -0 -P4 -n1 php -l > /dev/null

      - name: Node syntax check (wa_listener)
        run: |
          set -euo pipefail
          find wa_listener -path "*/node_modules" -prune -o -name "*.js" -print0 \
          | xargs -0 -n1 node --check

      - name: PHPUnit
        run: vendor/bin/phpunit --testdox --colors=never

  deploy:
    needs: test          # ← прод раскатывается только на зелёных тестах
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Ensure rsync
        shell: bash
        run: |
          if ! command -v rsync >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y rsync
          fi

      - name: Configure SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          ssh-keygen -l -f ~/.ssh/id_ed25519

      - name: Check SSH connectivity
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS="-p ${{ secrets.SSH_PORT }} -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10"
          ssh ${SSH_OPTS} "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "echo SSH_AUTH_OK"

      - name: Deploy files
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS="-p ${{ secrets.SSH_PORT }} -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3"

          for i in 1 2 3; do
            echo "rsync attempt ${i}/3"
            rsync -az \
              --delete \
              --delete-after \
              --exclude ".env" \
              --exclude ".env.*" \
              --exclude "*.log" \
              --exclude "tmp/" \
              --exclude "cache/" \
              --exclude ".cache/" \
              --exclude "vendor/" \
              --exclude "logs/" \
              --exclude ".git/" \
              --exclude ".github/" \
              --exclude "wa_listener/auth/" \
              --exclude "wa_listener/qr_state.json" \
              --exclude "wa_listener/node_modules/" \
              -e "ssh ${SSH_OPTS}" \
              ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/" && break
            sleep $((i * 3))
          done

      - name: Link static assets into public/
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS="-p ${{ secrets.SSH_PORT }} -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3"
          ssh ${SSH_OPTS} "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "
            D='${{ secrets.DEPLOY_PATH }}'
            ln -sfn \$D/assets \$D/public/assets
            rm -rf \$D/public/tr3
          "

      - name: Composer install
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS="-p ${{ secrets.SSH_PORT }} -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=3"
          ssh ${SSH_OPTS} "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cd '${{ secrets.DEPLOY_PATH }}' && /opt/php82/bin/php /usr/local/bin/composer install --no-dev --optimize-autoloader --no-interaction 2>&1"

      - name: Verify PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS="-p ${{ secrets.SSH_PORT }} -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3"
          ssh ${SSH_OPTS} "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "PHP=/opt/php82/bin/php && cd '${{ secrets.DEPLOY_PATH }}' && \$PHP -l public/index.php && \$PHP -l cron/kitchen_sync.php && \$PHP -l cron/telegram_alerts.php"

      - name: Smoke test
        shell: bash
        run: |
          sleep 3
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://veranda.my/login || echo "000")
          echo "HTTP status: ${STATUS}"
          if [ "${STATUS}" != "200" ] && [ "${STATUS}" != "302" ]; then
            echo "::warning::Smoke test returned ${STATUS} — check PHP-FPM and nginx vhost"
          fi
