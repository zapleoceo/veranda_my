name: CodeQL

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

concurrency:
  group: codeql-veranda-my
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: github/codeql-action/init@v3
        with:
          # Keep this list to languages CodeQL actually supports. PHP has no
          # extractor: naming it made init abort ("did not recognize"), which
          # killed the whole job — so JS/TS and Actions were never scanned
          # either. PHP static analysis needs a separate tool (PHPStan/Psalm).
          languages: javascript-typescript,actions

      - uses: github/codeql-action/analyze@v3
